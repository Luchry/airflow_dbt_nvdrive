name: novadrive
version: '1.0.0'
config-version: 2

profile: dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  source_database: NOVADRIVE
  source_schema: STAGE
  business_timezone: America/Sao_Paulo
  validate_current_price_discount: false

models:
  novadrive:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

seeds:
  novadrive:
    +enabled: false
