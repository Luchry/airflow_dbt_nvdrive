version: 2
sources:
  - name: "postgres"
    description: "Dados operacionais NovaDrive carregados pelo Airflow no Snowflake. O schema físico STAGE contém dados brutos; não é a camada de modelos staging do dbt. A carga inicial é histórica, as seguintes usam timestamp e watermark. Não se usa timestamp de negócio como prova de execução recente em tabelas sem alterações."
    database: "{{ var('source_database', 'NOVADRIVE') }}"
    schema: "{{ var('source_schema', 'STAGE') }}"
    tables:
      - name: "veiculos"
        description: "Cadastro operacional de veiculos replicado do Postgres por MERGE. Uma linha por veículo; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_veiculos"
            data_type: "NUMBER(38,0)"
            description: "Identificador único do veículo no sistema de origem."
            data_tests:
              - "not_null"
              - "unique"
          - name: "nome"
            data_type: "VARCHAR"
            description: "Nome comercial do veículo, sem espaços nas extremidades."
            data_tests:
              - "not_null"
          - name: "tipo"
            data_type: "VARCHAR"
            description: "Categoria do veículo conforme o cadastro de origem."
            data_tests:
              - "not_null"
          - name: "valor"
            data_type: "NUMBER(10,2)"
            description: "Preço sugerido atual do cadastro, em reais. Não representa o preço histórico na data da venda."
            data_tests:
              - "not_null"
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
      - name: "estados"
        description: "Cadastro operacional de estados replicado do Postgres por MERGE. Uma linha por estado; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_estados"
            data_type: "NUMBER(38,0)"
            description: "Identificador único do estado na origem."
            data_tests:
              - "not_null"
              - "unique"
          - name: "estado"
            data_type: "VARCHAR"
            description: "Nome do estado sem espaços nas extremidades."
            data_tests:
              - "not_null"
          - name: "sigla"
            data_type: "VARCHAR"
            description: "Sigla do estado, normalizada em maiúsculas e com dois caracteres, conforme o CHAR(2) da origem."
            data_tests:
              - "not_null"
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
      - name: "cidades"
        description: "Cadastro operacional de cidades replicado do Postgres por MERGE. Uma linha por cidade; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_cidades"
            data_type: "NUMBER(38,0)"
            description: "Identificador único da cidade na origem."
            data_tests:
              - "not_null"
              - "unique"
          - name: "cidade"
            data_type: "VARCHAR"
            description: "Nome da cidade sem espaços nas extremidades."
            data_tests:
              - "not_null"
          - name: "id_estados"
            data_type: "NUMBER(38,0)"
            description: "Estado ao qual a cidade pertence."
            data_tests:
              - "not_null"
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
      - name: "concessionarias"
        description: "Cadastro operacional de concessionarias replicado do Postgres por MERGE. Uma linha por concessionária; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_concessionarias"
            data_type: "NUMBER(38,0)"
            description: "Identificador único da concessionária na origem."
            data_tests:
              - "not_null"
              - "unique"
          - name: "concessionaria"
            data_type: "VARCHAR"
            description: "Nome da concessionária sem espaços nas extremidades."
            data_tests:
              - "not_null"
          - name: "id_cidades"
            data_type: "NUMBER(38,0)"
            description: "Cidade da concessionária."
            data_tests:
              - "not_null"
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
      - name: "vendedores"
        description: "Cadastro operacional de vendedores replicado do Postgres por MERGE. Uma linha por vendedor; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_vendedores"
            data_type: "NUMBER(38,0)"
            description: "Identificador único do vendedor na origem."
            data_tests:
              - "not_null"
              - "unique"
          - name: "nome"
            data_type: "VARCHAR"
            description: "Nome do vendedor sem espaços nas extremidades."
            data_tests:
              - "not_null"
          - name: "id_concessionarias"
            data_type: "NUMBER(38,0)"
            description: "Concessionária atual do cadastro do vendedor; pode diferir da concessionária de uma venda passada."
            data_tests:
              - "not_null"
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
      - name: "clientes"
        description: "Cadastro operacional de clientes replicado do Postgres por MERGE. Uma linha por cliente; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_clientes"
            data_type: "NUMBER(38,0)"
            description: "Identificador único do cliente na origem."
            data_tests:
              - "not_null"
              - "unique"
          - name: "cliente"
            data_type: "VARCHAR"
            description: "Nome do cliente sem espaços nas extremidades."
            data_tests:
              - "not_null"
          - name: "endereco"
            data_type: "VARCHAR"
            description: "Endereço cadastral do cliente. Informação pessoal; usar dados fictícios em demonstrações públicas."
            data_tests:
              - "not_null"
          - name: "id_concessionarias"
            data_type: "NUMBER(38,0)"
            description: "Concessionária atual do cadastro do cliente."
            data_tests:
              - "not_null"
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
      - name: "vendas"
        description: "Cadastro operacional de vendas replicado do Postgres por MERGE. Uma linha por venda; atualizações sobrescrevem o estado anterior, sem histórico de versões ou exclusões físicas."
        columns:
          - name: "id_vendas"
            data_type: "NUMBER(38,0)"
            description: "Identificador único da venda. Cada linha representa uma venda de um veículo."
            data_tests:
              - "not_null"
              - "unique"
          - name: "id_veiculos"
            data_type: "NUMBER(38,0)"
            description: "Veículo associado à venda."
            data_tests:
              - "not_null"
          - name: "id_concessionarias"
            data_type: "NUMBER(38,0)"
            description: "Concessionária registrada na venda, usada para atribuir seu faturamento."
            data_tests:
              - "not_null"
          - name: "id_vendedores"
            data_type: "NUMBER(38,0)"
            description: "Vendedor associado à venda."
            data_tests:
              - "not_null"
          - name: "id_clientes"
            data_type: "NUMBER(38,0)"
            description: "Cliente associado à venda."
            data_tests:
              - "not_null"
          - name: "valor_pago"
            data_type: "NUMBER(10,2)"
            description: "Valor efetivamente pago nesta venda, em reais e com duas casas decimais."
            data_tests:
              - "not_null"
          - name: "data_venda"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante da venda. Obrigatório na camada analítica para permitir a agregação temporal."
          - name: "data_inclusao"
            data_type: "TIMESTAMP_LTZ"
            description: "Instante de inclusão informado pela origem; pode estar ausente em registros legados."
          - name: "data_atualizacao"
            data_type: "TIMESTAMP_LTZ"
            description: "Timestamp de atualização mantido pelo sistema de origem em cada alteração; pode ser nulo quando data_inclusao estiver preenchida."
